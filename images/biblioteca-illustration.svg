<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb703;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <!-- Books on shelf -->
  <!-- Book 1 -->
  <rect x="50" y="120" width="25" height="120" fill="#2a3a4a" stroke="url(#bookGrad)" stroke-width="2"/>
  <line x1="55" y1="130" x2="70" y2="130" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  <line x1="55" y1="145" x2="70" y2="145" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  
  <!-- Book 2 -->
  <rect x="85" y="100" width="25" height="140" fill="#1a3a2a" stroke="url(#bookGrad)" stroke-width="2"/>
  <line x1="90" y1="115" x2="105" y2="115" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  <line x1="90" y1="135" x2="105" y2="135" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  <line x1="90" y1="155" x2="105" y2="155" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  
  <!-- Book 3 -->
  <rect x="120" y="130" width="25" height="110" fill="#3a1a1a" stroke="url(#bookGrad)" stroke-width="2"/>
  <line x1="125" y1="145" x2="140" y2="145" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  <line x1="125" y1="165" x2="140" y2="165" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  
  <!-- Book 4 -->
  <rect x="155" y="110" width="25" height="130" fill="#2a2a1a" stroke="url(#bookGrad)" stroke-width="2"/>
  <line x1="160" y1="125" x2="175" y2="125" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  <line x1="160" y1="145" x2="175" y2="145" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  <line x1="160" y1="165" x2="175" y2="165" stroke="#ffb703" stroke-width="1" opacity="0.7"/>
  
  <!-- Book 5 (Floating/Highlighted) -->
  <rect x="210" y="90" width="30" height="150" fill="#ffb703" stroke="#ff9500" stroke-width="2" opacity="0.9"/>
  <line x1="216" y1="110" x2="234" y2="110" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="216" y1="130" x2="234" y2="130" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="216" y1="150" x2="234" y2="150" stroke="#000000" stroke-width="1" opacity="0.6"/>
  <line x1="216" y1="170" x2="234" y2="170" stroke="#000000" stroke-width="1" opacity="0.6"/>
  
  <!-- Light rays from highlighted book -->
  <line x1="225" y1="85" x2="225" y2="40" stroke="#ffb703" stroke-width="2" opacity="0.5"/>
  <line x1="200" y1="95" x2="160" y2="50" stroke="#ffb703" stroke-width="1" opacity="0.3"/>
  <line x1="250" y1="95" x2="290" y2="50" stroke="#ffb703" stroke-width="1" opacity="0.3"/>
  
  <!-- Book shelf -->
  <rect x="40" y="240" width="280" height="8" fill="#1a1a1a" stroke="#ffb703" stroke-width="2"/>
  
  <!-- Knowledge symbol (lightbulb) -->
  <circle cx="330" cy="120" r="15" fill="none" stroke="#ffb703" stroke-width="2"/>
  <rect x="325" y="135" width="10" height="20" fill="#1a1a1a" stroke="#ffb703" stroke-width="1"/>
  <line x1="320" y1="155" x2="340" y2="155" stroke="#ffb703" stroke-width="2"/>
  <circle cx="330" cy="120" r="8" fill="#ffb703" opacity="0.6"/>
</svg>