<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb703;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <!-- 95% Circle (Sleeping) -->
  <circle cx="100" cy="150" r="80" fill="none" stroke="#333333" stroke-width="2"/>
  <circle cx="100" cy="150" r="70" fill="#1a1a1a" opacity="0.8"/>
  <text x="100" y="140" font-size="32" fill="#cccccc" text-anchor="middle" font-weight="bold">95%</text>
  <text x="100" y="165" font-size="12" fill="#ffb703" text-anchor="middle">Dormindo</text>
  
  <!-- Sleeping people icons -->
  <circle cx="70" cy="120" r="4" fill="#666666"/>
  <circle cx="100" cy="115" r="4" fill="#666666"/>
  <circle cx="130" cy="120" r="4" fill="#666666"/>
  
  <!-- Arrow -->
  <path d="M 180 150 L 220 150" stroke="url(#goldGrad)" stroke-width="3" fill="none" marker-end="url(#arrowhead)"/>
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#ffb703" />
    </marker>
  </defs>
  
  <!-- 5% Circle (Awakened) -->
  <circle cx="300" cy="150" r="80" fill="none" stroke="#ffb703" stroke-width="3"/>
  <circle cx="300" cy="150" r="70" fill="#1a2a1a" opacity="0.9"/>
  <text x="300" y="140" font-size="32" fill="#ffb703" text-anchor="middle" font-weight="bold">5%</text>
  <text x="300" y="165" font-size="12" fill="#ffb703" text-anchor="middle">Despertado</text>
  
  <!-- Awakened person with light -->
  <circle cx="300" cy="100" r="8" fill="#ffb703"/>
  <circle cx="300" cy="100" r="15" fill="none" stroke="#ffb703" stroke-width="1" opacity="0.5"/>
  <circle cx="300" cy="100" r="25" fill="none" stroke="#ffb703" stroke-width="1" opacity="0.2"/>
</svg>