<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="networkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb703;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="300" fill="#0a0a0a"/>
  
  <!-- Center node -->
  <circle cx="200" cy="150" r="20" fill="url(#networkGrad)" stroke="#ffb703" stroke-width="2"/>
  <text x="200" y="157" font-size="16" fill="#000000" text-anchor="middle" font-weight="bold">A</text>
  
  <!-- Connection lines -->
  <line x1="200" y1="150" x2="80" y2="60" stroke="#ffb703" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="150" x2="320" y2="50" stroke="#ffb703" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="150" x2="320" y2="150" stroke="#ffb703" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="150" x2="320" y2="250" stroke="#ffb703" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="150" x2="80" y2="240" stroke="#ffb703" stroke-width="2" opacity="0.6"/>
  
  <!-- Peripheral nodes -->
  <!-- Top Left -->
  <circle cx="80" cy="60" r="15" fill="#1a2a1a" stroke="#ffb703" stroke-width="2"/>
  <text x="80" y="67" font-size="14" fill="#ffb703" text-anchor="middle" font-weight="bold">👥</text>
  
  <!-- Top Right -->
  <circle cx="320" cy="50" r="15" fill="#1a2a1a" stroke="#ffb703" stroke-width="2"/>
  <text x="320" y="57" font-size="14" fill="#ffb703" text-anchor="middle" font-weight="bold">💬</text>
  
  <!-- Right -->
  <circle cx="320" cy="150" r="15" fill="#1a2a1a" stroke="#ffb703" stroke-width="2"/>
  <text x="320" y="157" font-size="14" fill="#ffb703" text-anchor="middle" font-weight="bold">🌐</text>
  
  <!-- Bottom Right -->
  <circle cx="320" cy="250" r="15" fill="#1a2a1a" stroke="#ffb703" stroke-width="2"/>
  <text x="320" y="257" font-size="14" fill="#ffb703" text-anchor="middle" font-weight="bold">📱</text>
  
  <!-- Bottom Left -->
  <circle cx="80" cy="240" r="15" fill="#1a2a1a" stroke="#ffb703" stroke-width="2"/>
  <text x="80" y="247" font-size="14" fill="#ffb703" text-anchor="middle" font-weight="bold">🔗</text>
  
  <!-- Connecting nodes between peripherals -->
  <circle cx="150" cy="90" r="8" fill="#ffb703" opacity="0.5"/>
  <circle cx="260" cy="80" r="8" fill="#ffb703" opacity="0.5"/>
  <circle cx="280" cy="150" r="8" fill="#ffb703" opacity="0.5"/>
  <circle cx="260" cy="220" r="8" fill="#ffb703" opacity="0.5"/>
  <circle cx="150" cy="210" r="8" fill="#ffb703" opacity="0.5"/>
</svg>